# Loop chambers OU uniform — rulare lunga, control pentru hetero_long.
# Materiale identice pe toata geometria (e_n=0.9, beta_t=0.8).
# Predictie: J_loop -> 0 la convergenta (fara asimetrie materiala).
# Daca J_loop != 0 si aici => curentul vine EXCLUSIV din geometrie.
# Output dir separat: sim_out/loop_ou_uniform_long — nu suprascrie nimic.

geometry:
  preset: loop_chambers
  params:
    mat_cube_L: {e_n: 0.9, beta_t: 0.8}
    mat_cube_R: {e_n: 0.9, beta_t: 0.8}
    mat_funnel:
      - {e_n: 0.9, beta_t: 0.8}
      - {e_n: 0.9, beta_t: 0.8}
      - {e_n: 0.9, beta_t: 0.8}
      - {e_n: 0.9, beta_t: 0.8}
      - {e_n: 0.9, beta_t: 0.8}
      - {e_n: 0.9, beta_t: 0.8}
    mat_ret: {e_n: 0.9, beta_t: 0.8}

wall_model: ou

simulation:
  n_particles: 30000
  steps: 300000
  dt: 0.001
  mass: 1.0
  gamma: 1.0
  kT: 1.0
  seed: 42
  velocity_init: maxwell_boltzmann
  cfl: 0.5
  max_substeps: 32
  adapt_every: 1
  track_k: 200
  write_every: 10000
  log_every: 1000

output:
  dir: sim_out/loop_ou_uniform_long
  gsd: true
  csv: true
  gsd_subset: 15000
  box: [520.0, 320.0, 260.0]
