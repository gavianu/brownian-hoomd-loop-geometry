# Loop chambers cu DampedBounce și materiale HETEROGENE — "NESS fals" din teză.
# Reproduc materialele originale din legacy dar FĂRĂ zgomot termic (OU dezactivat).
# Predicție: asimetrie sistematică în ocupanța camerelor CUBE_L vs CUBE_R,
#            matrice tranziții asimetrică — NESS aparent indus de materiale diferite.
# Acesta este cazul "greșit" identificat în teză (perete netermalizant).
# Compară cu loop_chambers_ou (hetero) pentru a vedea că OU restaurează echilibrul.

geometry:
  preset: loop_chambers
  params:
    mat_cube_L: {e_n: 0.9, beta_t: 0.7}
    mat_cube_R: {e_n: 0.3, beta_t: 0.55}
    mat_funnel:
      - {e_n: 0.85, beta_t: 0.85}
      - {e_n: 0.98, beta_t: 0.30}
      - {e_n: 0.98, beta_t: 0.30}
      - {e_n: 0.98, beta_t: 0.30}
      - {e_n: 0.98, beta_t: 0.30}
      - {e_n: 0.98, beta_t: 0.30}
    mat_ret: {e_n: 0.98, beta_t: 0.02}

wall_model: damped

simulation:
  n_particles: 10000
  steps: 10000
  dt: 0.001
  mass: 1.0
  gamma: 1.0
  kT: 1.0
  seed: 42
  velocity_init: maxwell_boltzmann
  cfl: 0.5
  max_substeps: 32
  adapt_every: 1
  track_k: 200
  write_every: 1000
  log_every: 200

output:
  dir: sim_out/loop_chambers_damped_hetero
  gsd: true
  csv: true
  gsd_subset: 5000
  box: [520.0, 320.0, 260.0]
