# Box simplu cu pereți elastici ideali.
# Referință: energia cinetică se conservă exact, <v^2> rămâne la valoarea inițială.
# Compară cu baseline_simple_box (ou) pentru a vedea că OU nu alterează echilibrul.

geometry:
  preset: simple_box
  params:
    size: [100.0, 100.0, 100.0]
    center: [0.0, 0.0, 0.0]
    material:
      e_n: 1.0
      beta_t: 1.0

wall_model: elastic

simulation:
  n_particles: 5000
  steps: 5000
  dt: 0.01
  mass: 1.0
  gamma: 1.0
  kT: 1.0
  seed: 42
  velocity_init: maxwell_boltzmann
  cfl: 0.5
  max_substeps: 32
  adapt_every: 1
  track_k: 200
  write_every: 500
  log_every: 200

output:
  dir: sim_out/box_elastic
  gsd: true
  csv: true
  gsd_subset: 2000
  box: [120.0, 120.0, 120.0]
