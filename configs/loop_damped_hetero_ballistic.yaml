# Loop chambers damped hetero cu gamma=0.01 (regim cvasi-balistic).
# tau_v = m/gamma = 100 pasi — particulele "tin minte" coliziunile cu peretii.
# Predictie: asimetrie CUBE_L vs CUBE_R vizibila, materialele heterogene pot
# produce NESS aparent fara termostat extern.
# Compara cu loop_damped_hetero_langevin (gamma=1) pentru a vedea diferenta.

geometry:
  preset: loop_chambers
  params:
    mat_cube_L: {e_n: 0.9, beta_t: 0.7}
    mat_cube_R: {e_n: 0.3, beta_t: 0.55}
    mat_funnel:
      - {e_n: 0.85, beta_t: 0.85}
      - {e_n: 0.98, beta_t: 0.30}
      - {e_n: 0.98, beta_t: 0.30}
      - {e_n: 0.98, beta_t: 0.30}
      - {e_n: 0.98, beta_t: 0.30}
      - {e_n: 0.98, beta_t: 0.30}
    mat_ret: {e_n: 0.98, beta_t: 0.02}

wall_model: damped

simulation:
  n_particles: 30000
  steps: 30000
  dt: 0.001
  mass: 1.0
  gamma: 0.01        # tau_v = 100 pasi — regim cvasi-balistic
  kT: 1.0
  seed: 42
  velocity_init: maxwell_boltzmann
  cfl: 0.5
  max_substeps: 32
  adapt_every: 1
  track_k: 200
  write_every: 1000
  log_every: 500

output:
  dir: sim_out/loop_damped_hetero_ballistic
  gsd: true
  csv: true
  gsd_subset: 15000
  box: [520.0, 320.0, 260.0]
