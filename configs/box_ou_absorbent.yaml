# Box simplu cu pereti OU si material ABSORBANT (e_n~0, beta_t~0).
# Echivalent reflexiei difuze Maxwell: particula pleaca de la perete cu viteza
# pur termica, complet "uitata" de viteza incidenta.
# Predictie: acelasi echilibru MB ca baseline_simple_box (ou, e_n=0.95).
# Diferenta: dinamica near-wall si rata de termalizare, nu temperatura finala.
# Compara cu baseline_simple_box si box_damped_absorbent.

geometry:
  preset: simple_box
  params:
    size: [100.0, 100.0, 100.0]
    center: [0.0, 0.0, 0.0]
    material:
      e_n: 0.05
      beta_t: 0.05

wall_model: ou

simulation:
  n_particles: 5000
  steps: 5000
  dt: 0.01
  mass: 1.0
  gamma: 1.0
  kT: 1.0
  seed: 42
  velocity_init: maxwell_boltzmann
  cfl: 0.5
  max_substeps: 32
  adapt_every: 1
  track_k: 200
  write_every: 500
  log_every: 200

output:
  dir: sim_out/box_ou_absorbent
  gsd: true
  csv: true
  gsd_subset: 2000
  box: [120.0, 120.0, 120.0]
